name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.dev.txt
      - name: Install rendering libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcairo2 fonts-dejavu-core
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run application tests
        run: python -m pytest -q
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.python == '3.12'
        with:
          node-version: '24'
      - name: Run setup geocoding tests
        if: matrix.python == '3.12'
        run: node --test tests/test_nominatim.js
